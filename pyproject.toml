[project]
name = "hello-gpu-tilelang"
version = "0.1.0"
description = "TileLang (Metal backend) version of the hello-gpu course"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tilelang>=0.1.15",
    "numpy>=2.1",
    "torch>=2.8",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[[tool.uv.index]]
name = "bfsu"
url = "https://mirrors.bfsu.edu.cn/pypi/web/simple"
default = true